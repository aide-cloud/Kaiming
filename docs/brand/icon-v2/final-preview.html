<html><head><meta charset="utf-8"><style>
 body{margin:0;font-family:-apple-system,"PingFang SC",sans-serif;background:#141619;color:#e9e6df}
 .wrap{padding:34px 44px 30px}
 h1{font-size:20px;font-weight:600;letter-spacing:.04em;margin:0 0 5px}
 .sub{font-size:11px;color:#9aa0a8;letter-spacing:.14em;margin-bottom:26px}
 .sizes{display:flex;align-items:flex-end;gap:32px;margin-bottom:34px}
 .it{display:flex;flex-direction:column;align-items:center;gap:9px;font-size:10px;color:#8f959d;letter-spacing:.08em}
 img{display:block}
 .pixel{image-rendering:pixelated}
 .label{font-size:10px;color:#8f959d;letter-spacing:.18em;margin:0 0 12px}
 .dock{display:inline-flex;align-items:flex-end;gap:14px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);border-radius:24px;padding:12px 18px}
 .dock img{width:56px;height:56px}
 .row2{display:flex;gap:60px;align-items:flex-start;margin-top:6px}
 .light{background:#f3f1ec;color:#1b1b1b;padding:26px 44px 32px}
 .light .label{color:#8a8a8a}
 .note{font-size:10px;color:#8f959d;margin-top:9px;letter-spacing:.04em}
</style></head><body>
<div class="wrap">
  <h1>开明 · 应用图标</h1>
  <div class="sub">KAIMING · APP ICON — 金环 · 三头开明兽 · 墨蓝</div>
  <div class="sizes">
    <div class="it"><img src="Kaiming-Icon-1024.png" width="208"><span>1024</span></div>
    <div class="it"><img src="AppIcon.appiconset/icon_128x128@2x.png" width="128"><span>256</span></div>
    <div class="it"><img src="AppIcon.appiconset/icon_128x128.png" width="64"><span>128</span></div>
    <div class="it"><img src="AppIcon.appiconset/icon_32x32@2x.png" width="32"><span>64</span></div>
    <div class="it"><img src="AppIcon.appiconset/icon_32x32.png" width="32"><span>32</span></div>
    <div class="it"><img src="AppIcon.appiconset/icon_16x16.png" width="64" class="pixel"><span>16 放大</span></div>
  </div>
  <div class="row2">
    <div>
      <div class="label">DOCK · 新 / 旧</div>
      <div class="dock">
        <img src="AppIcon.appiconset/icon_128x128@2x.png">
        <img src="../Kaiming-Color-1024.png">
      </div>
    </div>
  </div>
</div>
<div class="light">
  <div class="label">LIGHT BACKGROUND</div>
  <div class="sizes" style="margin:0">
    <div class="it" style="color:#777"><img src="AppIcon.appiconset/icon_128x128@2x.png" width="128"><span>256</span></div>
    <div class="it" style="color:#777"><img src="AppIcon.appiconset/icon_128x128.png" width="64"><span>128</span></div>
    <div class="it" style="color:#777"><img src="AppIcon.appiconset/icon_32x32@2x.png" width="32"><span>64</span></div>
    <div class="it" style="color:#777"><img src="AppIcon.appiconset/icon_32x32.png" width="32"><span>32</span></div>
    <div class="it" style="color:#777"><img src="AppIcon.appiconset/icon_16x16.png" width="64" class="pixel"><span>16</span></div>
  </div>
</div>
</body></html>
