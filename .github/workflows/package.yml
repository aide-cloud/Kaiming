name: Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build & package macOS app
    runs-on: macos-15
    timeout-minutes: 45
    env:
      UNIVERSAL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          set -euo pipefail
          # 避免 BSD sort 的 -V（macOS 自带 sort 不支持）；16.x 版本按字典序足够。
          XCODE_APP="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort | tail -1 || true)"
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version
          swift --version
          MAJOR="$(xcodebuild -version | awk '/^Xcode /{print $2}' | cut -d. -f1)"
          if [ "${MAJOR:-0}" -lt 16 ]; then
            echo "Kaiming requires Xcode 16 or newer" >&2
            exit 1
          fi

      - name: Build Release archive (ad-hoc signed, universal)
        run: ./Scripts/archive.sh

      - name: Verify app
        run: |
          set -euo pipefail
          APP="build/export/Kaiming.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -info "$APP/Contents/MacOS/Kaiming"
          lipo -info "$APP/Contents/Frameworks/MarkdownEngine.framework/Versions/A/MarkdownEngine"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$APP/Contents/Info.plist"

      - name: Package ZIP + DMG
        run: ./Scripts/package.sh build/export/Kaiming.app build/dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kaiming-${{ github.sha }}
          path: build/dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/dist/* --clobber
          else
            gh release create "$TAG" build/dist/* \
              --title "Kaiming $TAG" \
              --notes "Automated macOS build for $TAG. Ad-hoc signed; see docs/distribution.md for Developer ID signing and notarization." \
              --verify-tag
          fi
